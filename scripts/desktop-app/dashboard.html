<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Via Fidei · Admin Worker Command Center</title>
    <style>
      :root {
        --paper: #2e2e2e;
        --paper-warm: #343434;
        --paper-bright: #3a3a3a;
        --ink: #fbf8f1;
        --ink-soft: #ece8df;
        --ink-faint: #b9b4a8;
        --rule: rgba(251, 248, 241, 0.1);
        --gold: #b68d40;
        --purple: #a88bd4;
        --green: #4ba36a;
        --amber: #d09a3c;
        --red: #e07070;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--purple);
      }
      h1,
      h2,
      h3 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        margin: 0;
      }
      .wrap {
        padding: 18px 22px 60px;
        max-width: 1600px;
        margin: 0 auto;
      }

      header.top {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 18px;
      }
      header.top h1 {
        font-size: 25px;
        letter-spacing: 0.02em;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--ink-faint);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        border: 1px solid var(--rule);
        background: rgba(255, 255, 255, 0.04);
      }
      .pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink-faint);
      }
      .pill.on {
        border-color: rgba(75, 163, 106, 0.5);
        color: #9fdcb4;
      }
      .pill.on .dot {
        background: var(--green);
        box-shadow: 0 0 8px rgba(75, 163, 106, 0.8);
      }
      .pill.warn {
        border-color: rgba(208, 154, 60, 0.5);
        color: #e8c68a;
      }
      .pill.warn .dot {
        background: var(--amber);
      }
      .pill.off .dot {
        background: #6f6f6f;
      }
      .pill.bad {
        border-color: rgba(224, 112, 112, 0.5);
        color: #f0a5a5;
      }
      .pill.bad .dot {
        background: var(--red);
      }
      .spacer {
        flex: 1;
      }

      .strip {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }
      .metric {
        background: var(--paper-warm);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 9px 11px;
      }
      .metric .label {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--ink-faint);
      }
      .metric .value {
        font-size: 19px;
        font-family: var(--mono);
        margin-top: 3px;
      }
      .metric .sub {
        font-size: 10.5px;
        color: var(--ink-faint);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
        align-items: center;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: var(--paper-bright);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 6px 12px;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease;
      }
      button:hover:not(:disabled) {
        background: #474747;
        border-color: rgba(182, 141, 64, 0.6);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: rgba(182, 141, 64, 0.18);
        border-color: rgba(182, 141, 64, 0.55);
      }

      #drop {
        border: 1px dashed rgba(251, 248, 241, 0.25);
        border-radius: 4px;
        padding: 12px 14px;
        margin-bottom: 18px;
        color: var(--ink-faint);
        font-size: 12px;
        text-align: center;
      }
      #drop.hot {
        border-color: var(--gold);
        color: var(--ink);
        background: rgba(182, 141, 64, 0.08);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 14px;
      }
      section.card {
        background: var(--paper-warm);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 13px 15px;
        overflow: hidden;
      }
      section.card > h2 {
        font-size: 15px;
        margin-bottom: 9px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      section.card > h2 .count {
        font-size: 10px;
        color: var(--ink-faint);
        font-family: var(--mono);
      }
      .scroll {
        max-height: 320px;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
      }
      th {
        text-align: left;
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        color: var(--ink-faint);
        font-weight: 500;
        padding: 4px 8px 4px 0;
        border-bottom: 1px solid var(--rule);
        position: sticky;
        top: 0;
        background: var(--paper-warm);
      }
      td {
        padding: 4px 8px 4px 0;
        border-bottom: 1px solid rgba(251, 248, 241, 0.05);
        vertical-align: top;
      }
      td.mono,
      .mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      .muted {
        color: var(--ink-faint);
      }
      .ok {
        color: #9fdcb4;
      }
      .warnc {
        color: #e8c68a;
      }
      .bad {
        color: #f0a5a5;
      }
      .empty {
        color: var(--ink-faint);
        font-style: italic;
        padding: 6px 0;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 12px;
        font-size: 12px;
      }
      .kv dt {
        color: var(--ink-faint);
      }
      .kv dd {
        margin: 0;
      }
      pre.log {
        margin: 0;
        font-family: var(--mono);
        font-size: 10.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 340px;
        overflow: auto;
        color: var(--ink-soft);
      }
      .log-host {
        color: var(--gold);
      }
      #toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: var(--paper-bright);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--gold);
        border-radius: 3px;
        padding: 10px 14px;
        font-size: 12px;
        max-width: 460px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
        white-space: pre-wrap;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="eyebrow">Via Fidei</div>
          <h1>Admin Worker Command Center</h1>
        </div>
        <span id="execPill" class="pill off"
          ><span class="dot"></span><span id="execLabel">connecting…</span></span
        >
        <span id="hostPill" class="pill"
          ><span class="dot"></span><span id="hostLabel">local host</span></span
        >
        <div class="spacer"></div>
        <span class="eyebrow" id="generatedAt"></span>
        <button id="refresh">Refresh</button>
      </header>

      <div
        id="notices"
        style="
          display: none;
          background: rgba(224, 112, 112, 0.12);
          border: 1px solid rgba(224, 112, 112, 0.4);
          border-radius: 3px;
          padding: 9px 12px;
          margin-bottom: 14px;
          font-size: 12px;
        "
      ></div>

      <div class="strip" id="strip"></div>

      <div class="actions" id="actions"></div>

      <div id="drop">
        Drop a file here — or <button id="pick" style="padding: 3px 9px">choose a file</button> — to
        hand it to the local Admin Worker. Files are processed on this Mac and enter the normal
        classification, verification and publishing standards. Nothing inside a file is ever
        executed.
        <input id="file" type="file" hidden />
      </div>

      <div class="grid" id="grid"></div>
    </div>
    <div id="toast"></div>

    <script>
      const TOKEN = "__CONTROL_TOKEN__";
      const api = (p, opts = {}) =>
        fetch(p, {
          ...opts,
          headers: { Authorization: "Bearer " + TOKEN, ...(opts.headers || {}) },
        });

      const el = (tag, attrs = {}, ...kids) => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") n.className = v;
          else if (k === "html") n.innerHTML = v;
          else n.setAttribute(k, v);
        }
        for (const kid of kids.flat()) {
          if (kid == null) continue;
          n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        }
        return n;
      };

      const fmtBytes = (b) =>
        b == null
          ? "—"
          : b > 1e9
            ? (b / 1073741824).toFixed(1) + " GB"
            : (b / 1048576).toFixed(0) + " MB";
      const fmtDur = (ms) => {
        if (ms == null) return "—";
        const s = Math.floor(ms / 1000);
        if (s < 60) return s + "s";
        if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
        if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
        return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
      };
      const ago = (iso) => (iso ? fmtDur(Date.now() - new Date(iso).getTime()) + " ago" : "never");
      const pct = (n) => (n == null ? "—" : (n * 100).toFixed(0) + "%");
      const short = (v, n = 68) => {
        const s = v == null ? "" : String(v);
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
      };

      let toastTimer;
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
      }

      /* ---------------- status strip ---------------- */

      let lastExec = {};
      function renderStatus(s) {
        // SSE status frames legitimately omit `execution` (it costs a DB read),
        // so keep the last known value instead of falling back to OFF and making
        // the pill flap between "running locally" and "OFF" every two seconds.
        if (s.execution) lastExec = s.execution;
        const ex = s.execution || lastExec;
        const pill = document.getElementById("execPill");
        const label = document.getElementById("execLabel");
        const state = ex.state || "OFF";
        pill.className =
          "pill " +
          (state === "LOCAL_ACTIVE"
            ? "on"
            : state === "OFF"
              ? "off"
              : state === "LOCAL_DISCONNECTED"
                ? "warn"
                : "bad");
        label.textContent =
          state === "LOCAL_ACTIVE"
            ? "Running locally on this Mac"
            : state === "OFF"
              ? "Admin Worker OFF"
              : state === "LOCAL_DISCONNECTED"
                ? "ON — local runtime disconnected"
                : "Remote runtime (overridden)";
        document.getElementById("hostLabel").textContent =
          (s.hostLabel || "local") + " · " + (s.runState || "off");

        const notices = [];
        if ((s.runState === "failed" || s.runState === "crashed") && s.failureReason)
          notices.push("⚠ " + s.failureReason);
        else if (s.runState === "crashed")
          notices.push(
            "⚠ The local worker exited unexpectedly and is being restarted here — execution did not move to the cloud.",
          );
        if (s.pendingDurableOff)
          notices.push(
            "⚠ Stopped locally — the database could not be reached to record OFF; it is retried until it lands.",
          );
        // Configuration provenance: a worker pointed at the wrong database (a
        // laptop .env → localhost) or at Railway's private network must be the
        // first thing on screen, not something to discover from empty growth.
        const cfg = s.config || {};
        lastConfig = cfg;
        for (const w of cfg.warnings || []) notices.push("⚠ " + w);
        // Snapshot cadence follows the worker: 20 s while it runs, 5 min while
        // OFF (a snapshot is ~30 production queries over the public proxy).
        const running = s.runState === "running" || s.runState === "starting";
        setSnapshotCadence(running ? 20000 : 300000);
        if (
          s.browser &&
          s.browser.available === false &&
          (ex.state === "LOCAL_ACTIVE" || s.runState === "running")
        ) {
          notices.push("Headless browser rendering is off: " + s.browser.detail);
        }
        const noticeBox = document.getElementById("notices");
        noticeBox.textContent = notices.join("  ·  ");
        noticeBox.style.display = notices.length ? "block" : "none";

        const r = s.resources || {};
        const strip = document.getElementById("strip");
        const w = s.worker;
        const br = s.browser || {};
        const db = cfg.database || {};
        const items = [
          [
            "Database",
            db.reachable ? "connected" : cfg.databaseHost ? "unreachable" : "not configured",
            (cfg.databaseHost || "—") +
              (db.reachable && db.latencyMs != null ? " · " + db.latencyMs + "ms" : "") +
              (cfg.source ? " · via " + cfg.source : ""),
          ],
          [
            "Worker memory",
            w ? fmtBytes(w.rssBytes) : "—",
            w ? w.processes + " process(es): worker, brain, browser" : "worker not running",
          ],
          [
            "Worker CPU",
            w ? w.cpuPercent + "%" : "—",
            "system load " + (r.systemLoadPercent ?? 0) + "%",
          ],
          ["Supervisor", fmtBytes(r.processRssBytes), "this control process"],
          ["Free memory", fmtBytes(r.freeMemoryBytes), "of " + fmtBytes(r.totalMemoryBytes)],
          ["Cores", r.cpuCount ?? "—", "concurrency " + (r.recommendedConcurrency ?? "—")],
          [
            "Browser rendering",
            br.available ? (br.active ?? 0) + " active" : "unavailable",
            br.available
              ? "cap " + (br.maxConcurrent ?? 1) + ", waiting " + (br.waiting ?? 0)
              : short(br.detail, 34),
          ],
          ["Active jobs", (s.activeJobs || []).length, (s.activeJobs || []).join(", ") || "idle"],
          ["Uptime", fmtDur(s.uptimeMs), "restarts " + (s.restarts ?? 0)],
          [
            "Items processed",
            s.counters?.itemsProcessed ?? 0,
            "published " + (s.counters?.itemsPublished ?? 0),
          ],
          [
            "Errors",
            s.counters?.errors ?? 0,
            s.failureReason
              ? short(s.failureReason, 34)
              : s.lastError
                ? short(s.lastError, 30)
                : "none",
          ],
        ];
        strip.replaceChildren(
          ...items.map(([label, value, sub]) =>
            el(
              "div",
              { class: "metric" },
              el("div", { class: "label" }, label),
              el("div", { class: "value" }, String(value)),
              el("div", { class: "sub" }, short(sub, 34)),
            ),
          ),
        );
      }

      /* ---------------- actions ---------------- */

      const PASSES = [
        ["content_goal", "Run full pass"],
        ["diagnostics", "Diagnostics"],
        ["source_discovery", "Source discovery"],
        ["homepage", "Homepage pass"],
        ["source_repair", "Source repair"],
        ["security", "Security pass"],
        ["report", "Report"],
        ["cleanup", "Cleanup"],
      ];

      function renderActions() {
        const bar = document.getElementById("actions");
        const buttons = PASSES.map(([type, label]) => el("button", { "data-pass": type }, label));
        const makeover = el(
          "button",
          { class: "primary", id: "makeover" },
          "Request homepage makeover",
        );
        const report = el("button", { id: "audit" }, "Developer audit PDF");
        bar.replaceChildren(
          el("span", { class: "eyebrow" }, "Local operations"),
          ...buttons,
          makeover,
          report,
        );
        bar
          .querySelectorAll("button[data-pass]")
          .forEach((b) => b.addEventListener("click", () => runPass(b.dataset.pass, b)));
        makeover.addEventListener("click", () => runMakeover(makeover));
        report.addEventListener("click", () => downloadAudit(report));
      }

      async function runPass(passType, button) {
        button.disabled = true;
        const original = button.textContent;
        button.textContent = "Running locally…";
        try {
          const res = await api("/api/pass", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ passType }),
          });
          const data = await res.json();
          toast(
            res.ok
              ? passType + " pass executed on this Mac: " + short(JSON.stringify(data.result), 320)
              : "Pass refused: " + (data.error || res.status),
          );
          loadSnapshot();
        } catch (err) {
          toast("Pass failed: " + err.message);
        } finally {
          button.disabled = false;
          button.textContent = original;
        }
      }

      async function runMakeover(button) {
        button.disabled = true;
        button.textContent = "Analysing homepage locally…";
        try {
          const res = await api("/api/homepage-makeover", { method: "POST" });
          const data = await res.json();
          toast(
            res.ok
              ? "Homepage makeover computed on this Mac. Draft " +
                  (data.draftId || "—") +
                  " · status " +
                  (data.status || "—") +
                  " · score " +
                  (data.finalScore ?? "—")
              : "Makeover failed: " + (data.detail || res.status),
          );
          loadSnapshot();
        } catch (err) {
          toast("Makeover failed: " + err.message);
        } finally {
          button.disabled = false;
          button.textContent = "Request homepage makeover";
        }
      }

      async function downloadAudit(button) {
        button.disabled = true;
        button.textContent = "Generating locally…";
        try {
          const res = await api("/api/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ period: "LAST_30_DAYS" }),
          });
          if (!res.ok) throw new Error("status " + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank");
          toast("Developer audit generated on this Mac (" + Math.round(blob.size / 1024) + " KB).");
        } catch (err) {
          toast("Report failed: " + err.message);
        } finally {
          button.disabled = false;
          button.textContent = "Developer audit PDF";
        }
      }

      /* ---------------- file ingestion ---------------- */

      async function ingest(file) {
        toast("Reading " + file.name + " locally…");
        const buf = await file.arrayBuffer();
        try {
          const res = await api("/api/ingest", {
            method: "POST",
            headers: {
              "Content-Type": "application/octet-stream",
              "X-Filename": encodeURIComponent(file.name),
              "X-Operator": "operator",
            },
            body: buf,
          });
          const data = await res.json();
          toast(
            "Ingested " +
              file.name +
              "\n" +
              "type: " +
              (data.fileKind || "?") +
              " · classified: " +
              (data.classification?.contentType || "—") +
              " (" +
              (data.classification?.confidence?.toFixed?.(2) ?? "—") +
              ")\n" +
              "disposition: " +
              (data.disposition || "?") +
              " — " +
              (data.reason || "") +
              (data.duplicates?.length ? "\nduplicates: " + data.duplicates.length : "") +
              (data.conflicts?.length ? "\ncontradictions: " + data.conflicts.length : "") +
              (data.injectionFlags?.length
                ? "\n⚠ instruction text found (ignored): " + data.injectionFlags.join(", ")
                : ""),
          );
          loadSnapshot();
        } catch (err) {
          toast("Ingestion failed: " + err.message);
        }
      }

      const drop = document.getElementById("drop");
      const fileInput = document.getElementById("file");
      document.getElementById("pick").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        if (fileInput.files?.[0]) ingest(fileInput.files[0]);
        fileInput.value = "";
      });
      ["dragenter", "dragover"].forEach((e) =>
        drop.addEventListener(e, (ev) => {
          ev.preventDefault();
          drop.classList.add("hot");
        }),
      );
      ["dragleave", "drop"].forEach((e) =>
        drop.addEventListener(e, (ev) => {
          ev.preventDefault();
          drop.classList.remove("hot");
        }),
      );
      drop.addEventListener("drop", (ev) => {
        const f = ev.dataTransfer?.files?.[0];
        if (f) ingest(f);
      });

      /* ---------------- snapshot rendering ---------------- */

      function table(columns, rows, render) {
        if (!rows || rows.length === 0)
          return el("div", { class: "empty" }, "Nothing recorded yet.");
        const head = el("tr", {}, ...columns.map((c) => el("th", {}, c)));
        const body = rows.map((r) =>
          el(
            "tr",
            {},
            ...render(r).map((cell) =>
              el(
                "td",
                { class: typeof cell === "object" && cell?.mono ? "mono" : "" },
                typeof cell === "object" && cell !== null && !cell.nodeType
                  ? String(cell.v ?? "")
                  : cell,
              ),
            ),
          ),
        );
        return el(
          "div",
          { class: "scroll" },
          el("table", {}, el("thead", {}, head), el("tbody", {}, ...body)),
        );
      }

      function card(title, count, content) {
        return el(
          "section",
          { class: "card" },
          el("h2", {}, title, count != null ? el("span", { class: "count" }, String(count)) : null),
          content,
        );
      }

      function statusClass(s) {
        const v = String(s || "").toLowerCase();
        if (
          ["pass", "passed", "succeeded", "published", "ok", "healthy", "approved"].some((k) =>
            v.includes(k),
          )
        )
          return "ok";
        if (["warn", "pending", "running", "review", "probation"].some((k) => v.includes(k)))
          return "warnc";
        if (["fail", "error", "reject", "blocked", "crash"].some((k) => v.includes(k)))
          return "bad";
        return "";
      }

      function renderSnapshot(s) {
        // The database host sits next to the timestamp so local-database
        // numbers can never be mistaken for production's.
        document.getElementById("generatedAt").textContent =
          "snapshot " +
          new Date(s.generatedAt).toLocaleTimeString() +
          (s.cached ? " (cached)" : "") +
          " · db " +
          (lastConfig.databaseHost || "not configured");
        const grid = document.getElementById("grid");
        const cards = [];

        // Worker status
        cards.push(
          card(
            "Worker status",
            null,
            el(
              "dl",

        cards.push(

        cards.push(

                { mono: true, v: g.gap ?? 0 },

        cards.push(

            table(

              (c) => [

                {
                  mono: true,
                  v: (c.coverageScore ?? 0).toFixed ? c.coverageScore.toFixed(2) : c.coverageScore,

                { mono: true, v: c.activeSourceCount ?? 0 },

                el(
                  "span",
                  { class: c.blockedByCoverage ? "bad" : "muted" },

          ),
        );

        // Pipeline
        cards.push(
          card(
            "Pipeline state",
            s.pipeline?.length,
            table(
              ["Stage", "Pending", "Running", "OK", "Failed", "Blocked"],
              s.pipeline?.slice(0, 40),
              (p) => [
                short(p.stage || p.stageName, 24),
                { mono: true, v: p.pending ?? 0 },
                { mono: true, v: p.running ?? 0 },
                { mono: true, v: p.succeeded ?? 0 },
                { mono: true, v: p.failed ?? 0 },
                { mono: true, v: p.blocked ?? 0 },
              ],
            ),
          ),
        );

        cards.push(
          card(
            "Package artifacts",
            Object.keys(s.artifactStatus || {}).length,
            table(["Status", "Count"], Object.entries(s.artifactStatus || {}), ([k, v]) => [
              el("span", { class: statusClass(k) }, k),
              { mono: true, v },
            ]),
          ),
        );

        // Passes + decisions
        cards.push(
          card(
            "Recent passes",
            s.passes?.length,
            table(["Type", "Status", "Built", "Published", "When"], s.passes?.slice(0, 15), (p) => [
              short(p.passType, 20),
              el("span", { class: statusClass(p.status) }, String(p.status)),
              { mono: true, v: p.contentBuilt },
              { mono: true, v: p.contentPublished },
              ago(p.startedAt),
            ]),
          ),
        );

        cards.push(
          card(
            "Recent decisions",
            s.decisions?.length,
            table(["Chosen action", "Why", "Conf.", "When"], s.decisions?.slice(0, 15), (d) => [
              short(d.chosenAction || d.decisionType, 30),
              short(d.reason || d.brainExplanation, 52),
              {
                mono: true,
                v: (d.confidence ?? 0).toFixed ? d.confidence.toFixed(2) : d.confidence,

            ]),
          ),
        );

        // Sources
        cards.push(
          card(
            "Source reputation",
            s.sourceReputation?.length,
            table(["Host", "Tier", "QA", "Publish"], s.sourceReputation?.slice(0, 25), (r) => [
              short(r.sourceHost, 30),
              el("span", { class: statusClass(r.reputationTier) }, String(r.reputationTier)),

        cards.push(

        // Knowledge + memory
        cards.push(
          card(
            "Knowledge graph",
            (s.knowledge?.nodes ?? 0) + " nodes / " + (s.knowledge?.edges ?? 0) + " edges",

              ["Node", "Type", "Entity", "Updated"],
              s.knowledge?.recentNodes?.slice(0, 15),

        cards.push(

        // Quality + safety
        cards.push(
          card(
            "Quality scores",
            s.qualityScores?.length,
            table(["Type", "Score", "Threshold", "Passed"], s.qualityScores?.slice(0, 15), (q) => [

        cards.push(

            table(

        cards.push(

        cards.push(
          card(
            "Repair plans",
            s.repairPlans?.length,
            table(["Kind", "Status", "Attempts", "Updated"], s.repairPlans?.slice(0, 15), (r) => [
              short(r.kind, 24),
              el("span", { class: statusClass(r.status) }, String(r.status)),

        // Review queue with actions
        const reviewRows = (s.reviewQueue || [])
          .slice(0, 15)
          .map((r) =>
            el(
              "tr",
              {},
              el("td", {}, short(r.contentTitle || r.proposedAction, 44)),
              el("td", {}, short(r.reason, 46)),
              el(
                "td",
                { class: "mono" },
                (r.confidence ?? 0).toFixed ? r.confidence.toFixed(2) : r.confidence,
              ),
              el(
                "td",
                {},
                el(
                  "button",
                  { "data-review": r.id, "data-action": "approve", style: "padding:2px 7px" },

        cards.push(
          card(

            reviewRows.length

                  "div",
                  { class: "scroll" },
                  el(
                    "table",

                    el(
                      "thead",

                      el("tr", {}, ...["Item", "Reason", "Conf.", ""].map((h) => el("th", {}, h))),

        // Security
        cards.push(

        // Homepage drafts with actions
        const draftRows = (s.homepageDrafts || [])
          .slice(0, 8)
          .map((d) =>

            b.disabled = true;
            const res = await api("/api/review/" + b.dataset.review, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: b.dataset.action, actor: "operator" }),
            });
            const data = await res.json().catch(() => ({}));
            toast("Review " + b.dataset.action + ": " + (data.detail || res.status));
            loadSnapshot();
          }),
        );
        grid.querySelectorAll("button[data-draft]").forEach((b) =>
          b.addEventListener("click", async () => {
            b.disabled = true;
            const res = await api("/api/homepage-draft/" + b.dataset.draft, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: b.dataset.action }),

            const data = await res.json().catch(() => ({}));
            toast("Homepage draft " + b.dataset.action + ": " + JSON.stringify(data).slice(0, 220));
            loadSnapshot();
          }),
        );
        paintLiveLog();
      }

      /* ---------------- live log + polling ---------------- */

      const liveLines = [];
      function paintLiveLog() {
        const pre = document.getElementById("liveLog");
        if (!pre) return;
        pre.replaceChildren(
          ...liveLines
            .slice(-300)
            .map((l) =>
              el(
                "div",
                { class: l.stream === "host" ? "log-host" : "" },
                new Date(l.at).toLocaleTimeString() + "  " + l.line,
              ),
            ),
        );
        pre.scrollTop = pre.scrollHeight;
      }

      let lastConfig = {};
      let snapshotIntervalMs = 20000;
      let snapshotTimer = null;
      function setSnapshotCadence(ms) {
        if (ms === snapshotIntervalMs && snapshotTimer) return;
        snapshotIntervalMs = ms;
        clearInterval(snapshotTimer);
        snapshotTimer = setInterval(loadSnapshot, snapshotIntervalMs);
      }

      async function loadSnapshot(forceRefresh) {
        try {
          const res = await api("/api/snapshot" + (forceRefresh === true ? "?refresh=1" : ""));
          if (!res.ok) throw new Error("status " + res.status);
          renderSnapshot(await res.json());
        } catch (err) {
          toast("Snapshot failed: " + err.message);
        }
      }

      async function loadStatus() {
        try {
          const res = await api("/api/status");
          if (res.ok) renderStatus(await res.json());
        } catch {
          /* transient */
        }
      }

      document.getElementById("refresh").addEventListener("click", () => {
        loadStatus();
        loadSnapshot(true);
      });

      // Status arrives on the SSE stream every 2 s (with the durable
      // switch/lease state the host caches); polling /api/status is only a
      // fallback while the stream is down, and slow, so an open console with
      // the worker OFF costs the database almost nothing.
      let statusFallback = null;
      const events = new EventSource("/api/events?token=" + TOKEN);
      events.addEventListener("status", (e) => {
        renderStatus(JSON.parse(e.data));
        if (statusFallback) {
          clearInterval(statusFallback);
          statusFallback = null;
        }
      });
      events.addEventListener("error", () => {
        if (!statusFallback) statusFallback = setInterval(loadStatus, 15000);
      });
      events.addEventListener("log", (e) => {
        liveLines.push(JSON.parse(e.data));
        paintLiveLog();
      });

      renderActions();
      loadStatus();
      loadSnapshot();
      api("/api/logs?limit=200")
        .then((r) => r.json())
        .then((d) => {
          liveLines.push(...(d.lines || []));
          paintLiveLog();
        })
        .catch(() => {});
      setSnapshotCadence(20000);
    </script>
  </body>
